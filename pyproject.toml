[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewbus"
version = "0.1.0"
description = "Reproducible reviewer-authority maps from public repository metadata"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Akhilesh Gogikar"}]
keywords = ["open-source", "code-review", "bus-factor", "maintainers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/akigogikar/reviewbus"
Issues = "https://github.com/akigogikar/reviewbus/issues"
Documentation = "https://github.com/akigogikar/reviewbus/tree/main/docs"

[project.scripts]
reviewbus = "reviewbus:main"

[tool.setuptools]
py-modules = ["reviewbus"]
