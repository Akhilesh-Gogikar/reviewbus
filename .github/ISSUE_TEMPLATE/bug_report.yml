name: Bug report
description: Report incorrect ReviewBus behavior using synthetic public-shaped metadata
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include private metadata, access tokens, employment data, or sensitive person information."
  - type: input
    id: version
    attributes:
      label: ReviewBus version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Linux", "macOS", "Windows"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include the command and invented GitHub-shaped JSON only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private repository, credential, employment, partner, customer, and sensitive person data.
          required: true
