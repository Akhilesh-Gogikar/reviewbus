name: Feature request
description: Propose an inspectable metric or responsible report improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Maintainer question
      description: What decision-support question is not answered today?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Proposed public evidence and metric
      description: Define computation, corrections, sample limits, and expected output.
    validations:
      required: true
  - type: textarea
    id: harm
    attributes:
      label: Misuse and bias risks
      description: Explain false inferences and responsible-use controls.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Acceptance criteria and synthetic test plan
      description: List observable completion conditions and the invented fixture that proves them.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Contribution intent
      options:
        - I can open a pull request after design agreement
        - I can help test or review
        - I am proposing the idea only
    validations:
      required: true
  - type: checkboxes
    id: cleanroom
    attributes:
      label: Clean-room confirmation
      options:
        - label: This proposal contains only public specifications and synthetic examples.
          required: true
